name: My.Tool

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry Run'
        type: boolean
        default: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
      # The report is posted as a pull request comment.
      pull-requests: write
    concurrency:
      # A newer push to the same branch supersedes any run still going. The workflow's own
      # name keeps one project's runs from cancelling another's.
      group: ${{ github.workflow }}-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore
        working-directory: services/api

      - name: Run check
        run: dotnet ritten check
        shell: bash
        working-directory: services/api
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      # Tags and releases are written back to the repository.
      contents: write
      id-token: write
    concurrency:
      # Releases queue rather than interleave.
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore
        working-directory: services/api

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Run deploy
        run: dotnet ritten deploy --auto-approve ${{ inputs['dry-run'] && '--dry-run' || '' }}
        shell: bash
        working-directory: services/api
        env:
          RITTEN_NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RITTEN_COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
