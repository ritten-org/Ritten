name: Wolfe.Hamelin.Build

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Build Pipeline
        run: dotnet run --project build/src/Wolfe.Hamelin.Build/Wolfe.Hamelin.Build.csproj -- verify
        shell: bash
        env:
          Build__ProjectFile: 'build/src/Wolfe.Hamelin.Build/Wolfe.Hamelin.Build.csproj'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
