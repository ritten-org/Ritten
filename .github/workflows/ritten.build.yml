name: Ritten.Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Build Pipeline
        run: dotnet run --project build/src/Ritten.Build/Ritten.Build.csproj -- verify
        shell: bash
        env:
          DotNet__ProjectFile: 'build/src/Ritten.Build/Ritten.Build.csproj'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
