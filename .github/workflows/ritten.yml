name: Ritten

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Build Pipeline
        run: dotnet run --project src/Ritten -- build
        shell: bash
        env:
          # Dependabot can't bump versions or write changelog entries, so its PRs skip those checks.
          # Pushes to main always run them, so the badge reflects real releasability.
          RITTEN_SKIP_VERSION_CHECK: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
          RITTEN_SKIP_CHANGELOG: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: Development
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Deploy Pipeline
        run: dotnet run --project src/Ritten -- deploy --auto-approve
        shell: bash
        env:
          RITTEN_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          RITTEN_COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
