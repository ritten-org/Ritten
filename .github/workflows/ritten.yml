name: Ritten

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry Run'
        type: boolean
        default: false
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    concurrency:
      # A newer push to the same PR or branch supersedes any run still going.
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Run build
        run: dotnet ritten build
        shell: bash
        env:
          # Dependabot can't bump versions or write changelog entries, so its PRs skip those checks.
          # Pushes to main always run them, so the badge reflects real releasability.
          RITTEN_SKIP_VERSION_CHECK: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
          RITTEN_SKIP_CHANGELOG: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    concurrency:
      # Deploys queue rather than interleave.
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Restore tools
        run: dotnet tool restore

      - name: Run deployment
        run: dotnet ritten deploy --auto-approve ${{ inputs['dry-run'] && '--dry-run' || '' }}
        shell: bash
        env:
          RITTEN_NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RITTEN_COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
